</head><body>

<main class="formwrap">
  <form class="rsform" novalidate data-form="jot-contractor-update" data-endpoint="">
    <header class="form-head"><h1>Contractor Record Update Request</h1></header>
    <p class="reqnote"><span class="req">*</span> Required</p>
    <div class="field"><span class="fl">Full Name<span class="req">*</span></span><div class="subgrid"><input class="fi" name="full_name_first" type="text" placeholder="First name" required><input class="fi" name="full_name_last" type="text" placeholder="Last name" required></div></div><div class="field"><label class="fl" for="contractor_id">Contractor ID<span class="req">*</span></label><input class="fi" id="contractor_id" name="contractor_id" type="text" required></div><div class="field"><label class="fl" for="nickname">Nickname</label><input class="fi" id="nickname" name="nickname" type="text"></div><div class="field"><label class="fl" for="civil_status">Civil Status</label><select class="fi" id="civil_status" name="civil_status"><option value="" disabled selected>Please select…</option><option value="Single">Single</option><option value="Married">Married</option><option value="Widowed">Widowed</option><option value="Legally Separated">Legally Separated</option><option value="Annulled">Annulled</option></select></div><div class="field"><label class="fl" for="birth_date">Birth Date</label><input class="fi" id="birth_date" name="birth_date" type="date"></div><div class="field"><label class="fl" for="birth_place">Birth Place</label><textarea class="fi" id="birth_place" name="birth_place" rows="4"></textarea></div><div class="field"><span class="fl">Home Address</span><div class="subgrid subgrid--addr"><input class="fi addr-full" name="home_address_street" type="text" placeholder="Street address"><input class="fi" name="home_address_city" type="text" placeholder="City"><input class="fi" name="home_address_state" type="text" placeholder="State / Province"><input class="fi" name="home_address_zip" type="text" placeholder="Postal / ZIP code"><input class="fi" name="home_address_country" type="text" placeholder="Country"></div></div><div class="field"><label class="fl" for="region">Region</label><select class="fi" id="region" name="region"><option value="" disabled selected>Please select…</option><option value="MIMAROPA">MIMAROPA</option><option value="Calabarzon">Calabarzon</option><option value="NCR">NCR</option><option value="CAR">CAR</option><option value="Region I">Region I</option><option value="Region II">Region II</option><option value="Region III">Region III</option><option value="Region V">Region V</option><option value="Region VI">Region VI</option><option value="Region VII">Region VII</option><option value="Region VIII">Region VIII</option><option value="Region IX">Region IX</option><option value="Region X">Region X</option><option value="Region XI">Region XI</option><option value="Region XII">Region XII</option></select></div><div class="field"><label class="fl" for="sss">SSS #</label><input class="fi" id="sss" name="sss" type="number"></div><div class="field"><label class="fl" for="tin">TIN #</label><input class="fi" id="tin" name="tin" type="number"></div><div class="field"><label class="fl" for="pagibig">Pagibig #</label><input class="fi" id="pagibig" name="pagibig" type="number"></div><div class="field"><label class="fl" for="philhealth">Philhealth #</label><input class="fi" id="philhealth" name="philhealth" type="number"></div><div class="field"><label class="fl" for="primary_mobile_number">Primary Mobile Number</label><input class="fi" id="primary_mobile_number" name="primary_mobile_number" type="tel"></div><div class="field"><label class="fl" for="secondary_mobile_number">Secondary Mobile Number</label><input class="fi" id="secondary_mobile_number" name="secondary_mobile_number" type="tel"></div><div class="field"><label class="fl" for="primary_landline_number">Primary Landline Number</label><input class="fi" id="primary_landline_number" name="primary_landline_number" type="tel"></div><div class="field"><label class="fl" for="secondary_landline_number">Secondary Landline Number</label><input class="fi" id="secondary_landline_number" name="secondary_landline_number" type="tel"></div><div class="field"><label class="fl" for="personal_email_address">Personal Email Address</label><input class="fi" id="personal_email_address" name="personal_email_address" type="email"></div><div class="field"><span class="fl">Delivery Address (shipment of RS related items)</span><div class="subgrid subgrid--addr"><input class="fi addr-full" name="delivery_address_shipment_of_rs_related__street" type="text" placeholder="Street address"><input class="fi" name="delivery_address_shipment_of_rs_related__city" type="text" placeholder="City"><input class="fi" name="delivery_address_shipment_of_rs_related__state" type="text" placeholder="State / Province"><input class="fi" name="delivery_address_shipment_of_rs_related__zip" type="text" placeholder="Postal / ZIP code"><input class="fi" name="delivery_address_shipment_of_rs_related__country" type="text" placeholder="Country"></div></div><div class="field"><label class="fl" for="contractor_type">Contractor Type</label><select class="fi" id="contractor_type" name="contractor_type"><option value="" disabled selected>Please select…</option><option value="Remote Teammate">Remote Teammate</option><option value="Support">Support</option></select></div><div class="field"><label class="fl" for="start_date_with_rocket_station">Start Date with Rocket Station<span class="req">*</span></label><input class="fi" id="start_date_with_rocket_station" name="start_date_with_rocket_station" type="date" required></div><div class="field"><label class="fl" for="rocket_station_email_address">Rocket Station Email Address</label><input class="fi" id="rocket_station_email_address" name="rocket_station_email_address" type="email"></div><div class="field"><label class="fl" for="emergency_contact_name">Emergency Contact Name</label><input class="fi" id="emergency_contact_name" name="emergency_contact_name" type="text"></div><div class="field"><label class="fl" for="relationship_to_emergency_contact_person">Relationship to Emergency Contact Person</label><select class="fi" id="relationship_to_emergency_contact_person" name="relationship_to_emergency_contact_person"><option value="" disabled selected>Please select…</option><option value="Spouse">Spouse</option><option value="Life Partner (not married)">Life Partner (not married)</option><option value="Parent">Parent</option><option value="Sibling">Sibling</option><option value="Relative">Relative</option></select></div><div class="field"><label class="fl" for="emergency_contact_mobile">Emergency Contact Mobile</label><input class="fi" id="emergency_contact_mobile" name="emergency_contact_mobile" type="tel"></div><div class="field"><label class="fl" for="emergency_contact_landline">Emergency Contact Landline</label><input class="fi" id="emergency_contact_landline" name="emergency_contact_landline" type="tel"></div><div class="field"><span class="fl">Emergency Contact Address</span><div class="subgrid subgrid--addr"><input class="fi addr-full" name="emergency_contact_address_street" type="text" placeholder="Street address"><input class="fi" name="emergency_contact_address_city" type="text" placeholder="City"><input class="fi" name="emergency_contact_address_state" type="text" placeholder="State / Province"><input class="fi" name="emergency_contact_address_zip" type="text" placeholder="Postal / ZIP code"><input class="fi" name="emergency_contact_address_country" type="text" placeholder="Country"></div></div>
    <button type="submit" class="submit">Submit</button>
    <div class="form-done" hidden><div class="done-ico">✓</div><h2>Thank you!</h2><p>Your response has been recorded.</p></div>
  </form>
