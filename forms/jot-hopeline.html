<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hopeline Session Request — Rocketeer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forms.css">
</head><body>
<div class="topbar"><a href="index.html">← All forms</a><span class="badge">Wellness</span></div>
<main class="formwrap">
  <form class="rsform" novalidate data-form="jot-hopeline" data-endpoint="">
    <header class="form-head"><h1>Hopeline Session Request</h1></header>
    <p class="reqnote"><span class="req">*</span> Required</p>
    <div class="field"><label class="fl" for="name">Name<span class="req">*</span></label><input class="fi" id="name" name="name" type="text" required></div><div class="field"><label class="fl" for="age">Age<span class="req">*</span></label><input class="fi" id="age" name="age" type="text" required></div><div class="field"><label class="fl" for="location">Location<span class="req">*</span></label><input class="fi" id="location" name="location" type="text" required></div><div class="field"><label class="fl" for="rocket_station_email">Rocket Station email<span class="req">*</span></label><input class="fi" id="rocket_station_email" name="rocket_station_email" type="text" required></div><div class="field"><label class="fl" for="contact_number">Contact number<span class="req">*</span></label><input class="fi" id="contact_number" name="contact_number" type="text" required></div><div class="field"><label class="fl" for="contractor_type">Contractor type<span class="req">*</span></label><select class="fi" id="contractor_type" name="contractor_type" required><option value="" disabled selected>Please select…</option><option value="Support">Support</option><option value="Remote Teammate">Remote Teammate</option></select></div><div class="field"><label class="fl" for="preferred_session">Preferred Session<span class="req">*</span></label><select class="fi" id="preferred_session" name="preferred_session" required><option value="" disabled selected>Please select…</option><option value="ZOOM Video call">ZOOM Video call</option><option value="ZOOM Audio call">ZOOM Audio call</option></select></div><div class="field" role="group" aria-label="What&#x27;s your reason for consultation?"><span class="fl">What&#x27;s your reason for consultation?</span><div class="opts"><label class="opt"><input type="radio" name="what_s_your_reason_for_consultation" value="Emotional and mental challenges (example: Difficulty handling emotions, anxiety, trauma, depression, grief or loss, suicidal thoughts, etc)"><span>Emotional and mental challenges (example: Difficulty handling emotions, anxiety, trauma, depression, grief or loss, suicidal thoughts, etc)</span></label><label class="opt"><input type="radio" name="what_s_your_reason_for_consultation" value="Well-being concerns (example: work stress, productivity issues, family problems, relationship problems, sleep problems, problem with peers, settings goals, habit formation and general wellness, etc)"><span>Well-being concerns (example: work stress, productivity issues, family problems, relationship problems, sleep problems, problem with peers, settings goals, habit formation and general wellness, etc)</span></label><label class="opt"><input type="radio" name="what_s_your_reason_for_consultation" value="Needs someone to talk to"><span>Needs someone to talk to</span></label></div></div><div class="field"><label class="fl" for="concern_that_you_wanted_to_discuss_or_is">Concern that you wanted to discuss or issues you’d like to focus on</label><input class="fi" id="concern_that_you_wanted_to_discuss_or_is" name="concern_that_you_wanted_to_discuss_or_is" type="text"></div><div class="field"><label class="fl" for="preferred_date_and_time_example_mwf_7pm_">Preferred date and time (example: MWF, 7PM PHT)</label><input class="fi" id="preferred_date_and_time_example_mwf_7pm_" name="preferred_date_and_time_example_mwf_7pm_" type="text"></div><div class="field"><label class="fl" for="emergency_contact_name">Emergency Contact Name</label><input class="fi" id="emergency_contact_name" name="emergency_contact_name" type="text"></div><div class="field"><label class="fl" for="emergency_contact_number">Emergency Contact Number</label><input class="fi" id="emergency_contact_number" name="emergency_contact_number" type="tel"></div><div class="field"><label class="fl" for="relationship">Relationship</label><input class="fi" id="relationship" name="relationship" type="text"></div><div class="field"><label class="fl" for="purpose">Purpose<span class="req">*</span></label><textarea class="fi" id="purpose" name="purpose" rows="4" required></textarea></div>
    <button type="submit" class="submit">Submit</button>
    <div class="form-done" hidden><div class="done-ico">✓</div><h2>Thank you!</h2><p>Your response has been recorded.</p></div>
  </form>
</main>
<script src="forms.js"></script>
</body></html>
