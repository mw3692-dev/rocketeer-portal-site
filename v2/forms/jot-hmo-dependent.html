<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HMO Dependent Enrollment — Rocketeer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forms.css">
</head><body>
<div class="topbar"><a href="index.html">← All forms</a><span class="badge">Benefits</span></div>
<main class="formwrap">
  <form class="rsform" novalidate data-form="jot-hmo-dependent" data-endpoint="">
    <header class="form-head"><h1>HMO Dependent Enrollment</h1></header>
    <p class="reqnote"><span class="req">*</span> Required</p>
    <div class="field"><span class="fl">Name<span class="req">*</span></span><div class="subgrid"><input class="fi" name="name_first" type="text" placeholder="First name" required><input class="fi" name="name_last" type="text" placeholder="Last name" required></div></div><div class="field"><label class="fl" for="contractor_id">Contractor ID<span class="req">*</span></label><input class="fi" id="contractor_id" name="contractor_id" type="text" required></div><div class="field"><label class="fl" for="gender">Gender<span class="req">*</span></label><select class="fi" id="gender" name="gender" required><option value="" disabled selected>Please select…</option><option value="FEMALE">FEMALE</option><option value="MALE">MALE</option></select></div><div class="field"><label class="fl" for="date_of_birth">Date of Birth<span class="req">*</span></label><input class="fi" id="date_of_birth" name="date_of_birth" type="date" required></div><div class="field"><label class="fl" for="civil_status">Civil Status<span class="req">*</span></label><select class="fi" id="civil_status" name="civil_status" required><option value="" disabled selected>Please select…</option><option value="Single">Single</option><option value="Married">Married</option><option value="Widowed">Widowed</option><option value="Legally Separated">Legally Separated</option></select></div><div class="field"><label class="fl" for="relationship">Relationship<span class="req">*</span></label><select class="fi" id="relationship" name="relationship" required><option value="" disabled selected>Please select…</option><option value="SPOUSE">SPOUSE</option><option value="FATHER">FATHER</option><option value="MOTHER">MOTHER</option><option value="SIBLING">SIBLING</option><option value="SON">SON</option><option value="DAUGHTER">DAUGHTER</option></select></div><div class="field"><label class="fl" for="upload_supporting_document_s">UPLOAD SUPPORTING DOCUMENT/S<span class="req">*</span></label><input class="fi fi--file" id="upload_supporting_document_s" name="upload_supporting_document_s" type="file" multiple required></div>
    <button type="submit" class="submit">Submit</button>
    <div class="form-done" hidden><div class="done-ico">✓</div><h2>Thank you!</h2><p>Your response has been recorded.</p></div>
  </form>
</main>
<script src="forms.js"></script>
</body></html>
